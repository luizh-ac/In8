name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json, Cargo.toml and package.json).
# This builds the installers, signs the update files and creates a draft release; publish the draft
# on GitHub to make it the update everyone's In8 sees.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # An older Ubuntu, so the AppImage runs on distros with older glibc too.
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: In8 ${{ github.ref_name }}
          releaseBody: Download the installer for your system below. In8 also updates itself from here.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
