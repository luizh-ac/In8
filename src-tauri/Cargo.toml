[package]
name = "in8"
version = "0.1.0"
description = "Get a freshly formatted PC ready: apps, debloat, tweaks and post-install setup"
edition = "2024"
rust-version = "1.90"

[lib]
name = "in8_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
ureq = "3.5.2"
sha2 = "0.11.1"
tauri-plugin-dialog = "2.8.4"
